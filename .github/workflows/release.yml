name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string
        default: "0.1.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse-version.outputs.tag }}
      version: ${{ steps.parse-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse and validate version
        id: parse-version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi

          # Strip leading 'v' to get semver
          VERSION="${RAW#v}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG}"
          echo "Target version: ${VERSION}"

          # Verify Cargo.toml version matches
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d ' ')
          if [ -n "$CARGO_VER" ] && [ "$CARGO_VER" != "$VERSION" ]; then
            echo "::error::Requested version ($VERSION) does not match Cargo.toml version ($CARGO_VER). Please update Cargo.toml first."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse-version.outputs.tag }}
          name: ${{ steps.parse-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/hl-background-cli.exe,LICENSE,README.md -DestinationPath hl-background-cli-${{ matrix.target }}.zip

      - name: Package (Unix)
        if: matrix.ext == 'tar.gz'
        run: |
          cp LICENSE README.md target/${{ matrix.target }}/release/
          tar -czf hl-background-cli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release hl-background-cli LICENSE README.md

      - name: Upload artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: hl-background-cli-${{ matrix.target }}.${{ matrix.ext }}

  publish-crate:
    name: Publish to crates.io
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (skipped when no token is configured)
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked
