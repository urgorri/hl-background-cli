[package]
name = "hl-background-cli"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight CLI and library to convert images into Half-Life background TGA slices"
license = "MIT"
readme = "README.md"
repository = "https://github.com/username/hl-background-cli"

[lib]
name = "hl_background_cli"
path = "src/lib.rs"

[[bin]]
name = "hl-background-cli"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
argh = "0.1"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
