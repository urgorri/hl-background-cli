[package]
name = "hl-bg"
version = "0.1.0"
edition = "2021"
description = "CLI and library to convert images into Half-Life background TGA slices"
license = "MIT"
readme = "README.md"
repository = "https://github.com/username/hl-bg"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
